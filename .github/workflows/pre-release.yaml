name: Pre-Release A$PECT UTILS

permissions:
  contents: write
  actions: read
  pull-requests: write

on:
  workflow_dispatch: # Manual trigger added

jobs:
  build-runspace:
    runs-on: windows-latest
    outputs:
      version: ${{ steps.extract_version.outputs.version }}
    env:
      CERTIFICATE_BASE64: ${{ secrets.CERTIFICATE_BASE64 }}
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v7

      - name: Generate Dev Docs and Update JSON Links
        shell: pwsh
        run: |
          Set-Location PowerShellApp/tools
          ./devdocs-generator.ps1

      - name: Compile project
        shell: pwsh
        run: |
          Set-ExecutionPolicy Bypass -Scope Process -Force; ./PowerShellApp/Compile.ps1
        continue-on-error: false # Directly fail the job on error, removing the need for a separate check

      - name: Create Pull Request for Updated Docs and JSON Links
        id: cpr
        continue-on-error: true
        uses: peter-evans/create-pull-request@v8
        with:
          token: ${{ secrets.AUTO_MERGE }}
          commit-message: 'chore: Update generated dev docs and JSON links'
          title: 'chore: Update generated dev docs and JSON links'
          body: 'Automated update of generated documentation and JSON config links from pre-release build'
          branch: docs-update
          delete-branch: true
          add-paths: |
            docs/src/content/docs/code-reference/
            PowerShellApp/config/tweaks.json
            PowerShellApp/config/feature.json
          labels: |
            automated
            documentation
            skip-changelog

      - name: Check outputs
        shell: bash
        run: |
          echo "Pull Request Number - ${{ steps.cpr.outputs.pull-request-number }}"
          echo "Pull Request URL - ${{ steps.cpr.outputs.pull-request-url }}"

      - name: Set Version to Todays Date
        id: extract_version
        run: |
          $version = (Get-Date -Format "yy.MM.dd")
          echo "VERSION=$version" >> $env:GITHUB_ENV
          echo "version=$version" >> $env:GITHUB_OUTPUT
        shell: pwsh

      - name: Create Tag
        id: create_tag
        run: |
          $tagExists = git tag -l $env:VERSION
          if ($tagExists -eq "") {
            git tag $env:VERSION
            if ($LASTEXITCODE -ne 0) {
              Write-Error "Failed to create tag $env:VERSION"
              exit 1
            }
            git push origin $env:VERSION
            if ($LASTEXITCODE -ne 0) {
              Write-Error "Failed to push tag $env:VERSION"
              exit 1
            }
          } else {
            Write-Host "Tag $env:VERSION already exists, skipping tag creation"
          }
        shell: pwsh

      - name: Upload compiled script
        uses: actions/upload-artifact@v7
        with:
          name: aspectutils-ps1
          path: ./PowerShellApp/AspectUtils.ps1

  build-desktop:
    runs-on: windows-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "8.0.x"

      - name: Install Inno Setup
        run: choco install innosetup --no-progress -y
        shell: pwsh

      - name: Build desktop app and installer
        run: ./Installer/build.ps1 -Inno -Zip
        shell: pwsh

      - name: Upload desktop artifact
        uses: actions/upload-artifact@v7
        with:
          name: aspectutils-desktop
          path: |
            AspectUtils-Desktop.zip
            Installer/output/launcher/AspectUtilsSetup.exe
            Installer/output/AspectUtils_Install.exe
          if-no-files-found: error

  release:
    needs: [build-runspace, build-desktop]
    runs-on: ubuntu-latest
    steps:
      - name: Download compiled script
        uses: actions/download-artifact@v8
        with:
          name: aspectutils-ps1
          path: ./ps-artifact

      - name: Download desktop release
        uses: actions/download-artifact@v8
        with:
          name: aspectutils-desktop
          path: ./desktop-artifact

      - name: Prepare release assets
        shell: pwsh
        run: |
          $script = Get-ChildItem -Path ./ps-artifact -Recurse -Filter AspectUtils.ps1 | Select-Object -First 1
          if (-not $script) { throw 'Compiled AspectUtils.ps1 was not found in the downloaded artifact.' }
          Copy-Item -LiteralPath $script.FullName -Destination ./AspectUtils.ps1 -Force

          # The WPF launcher with embedded payload is the primary release artifact.
          $launcher = Get-ChildItem -Path ./desktop-artifact -Recurse -Filter AspectUtilsSetup.exe | Select-Object -First 1
          if (-not $launcher) { throw 'The setup launcher (AspectUtilsSetup.exe) was not found in the downloaded artifact.' }
          Copy-Item -LiteralPath $launcher.FullName -Destination ./AspectUtilsSetup.exe -Force

          # The optional Inno Setup package is built with -Inno.
          $inno = Get-ChildItem -Path ./desktop-artifact -Recurse -Filter AspectUtils_Install.exe | Select-Object -First 1
          if ($inno) {
              Copy-Item -LiteralPath $inno.FullName -Destination ./AspectUtils_Install.exe -Force
          }

          $zip = Get-ChildItem -Path ./desktop-artifact -Recurse -Filter AspectUtils-Desktop.zip | Select-Object -First 1
          if (-not $zip) { throw 'AspectUtils-Desktop.zip was not found in the downloaded artifact.' }
          Copy-Item -LiteralPath $zip.FullName -Destination ./AspectUtils-Desktop.zip -Force

      - name: Set version from build job
        run: echo "VERSION=${{ needs.build-runspace.outputs.version }}" >> $GITHUB_ENV

      - name: Generate Release Notes
        id: generate_notes
        uses: release-drafter/release-drafter@v7
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          config-name: release-drafter.yml
          version: ${{ env.VERSION }}

      - name: Remove Automated Updates from Release Notes
        id: filter_notes
        shell: pwsh
        env:
          RELEASE_NOTES: ${{ steps.generate_notes.outputs.body }}
        run: |
          $filteredNotes = ($env:RELEASE_NOTES -split '\r?\n' | Where-Object {
            $_ -notmatch '(?i)Update (Generated Dev Docs|Sponsors)'
          }) -join "`n"

          $delimiter = [guid]::NewGuid().ToString()
          "body<<$delimiter" >> $env:GITHUB_OUTPUT
          $filteredNotes >> $env:GITHUB_OUTPUT
          $delimiter >> $env:GITHUB_OUTPUT

      - name: Create and Upload Release
        id: create_release
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ env.VERSION }}
          name: Pre-Release ${{ env.VERSION }}
          body: |
            ${{ steps.filter_notes.outputs.body }}

            ![GitHub Downloads (specific asset, specific tag)](https://img.shields.io/github/downloads/AspectCorp/AspectUtils/${{ env.VERSION }}/AspectUtils.ps1)
          append_body: false
          files: |
            ./AspectUtils.ps1
            ./AspectUtils-Desktop.zip
            ./AspectUtilsSetup.exe
          prerelease: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
