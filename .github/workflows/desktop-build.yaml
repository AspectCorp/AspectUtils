name: Build desktop app

on:
  push:
    branches: ["main"]
    paths:
      - "MainApp/**"
      - "PowerShellApp/config/**"
      - ".github/workflows/desktop-build.yaml"
  pull_request:
    branches: ["main"]
    paths:
      - "MainApp/**"
      - "PowerShellApp/config/**"
      - ".github/workflows/desktop-build.yaml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "8.0.x"

      - name: Build
        run: dotnet build MainApp\AspectUtils.Desktop.csproj -c Release

      - name: Publish self-contained
        run: >
          dotnet publish MainApp\AspectUtils.Desktop.csproj
          -c Release
          -r win-x64
          --self-contained true
          -p:PublishSingleFile=true
          -o artifacts\desktop

      - name: Upload desktop artifact
        uses: actions/upload-artifact@v7
        with:
          name: aspectutils-desktop
          path: artifacts/desktop
          if-no-files-found: error
