name: Remove AspectUtils.ps1 if included in a Push

on:
  push:
    branches:
      - '**'

jobs:
  check-and-delete-file:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v7

    - name: Check if AspectUtils.ps1 exists
      id: check_existence
      run: |
        if [ -f "AspectUtils.ps1" ]; then
          echo "aspectutils_exists=true" >> $GITHUB_OUTPUT
        else
          echo "aspectutils_exists=false" >> $GITHUB_OUTPUT
        fi

    - name: Delete AspectUtils.ps1 if it exists
      if: steps.check_existence.outputs.aspectutils_exists == 'true'
      run: |
        git config --global user.email "aspectutils-action@noreply.github.com"
        git config --global user.name "aspectutils-action"
        git rm AspectUtils.ps1
        git commit -m "Delete AspectUtils.ps1 as it is not allowed"
        git push origin HEAD:${{ github.ref }}
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
